<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="FST-7 Swim Physique Dashboard — personal PPL training">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a100c"/>
      <stop offset=".55" stop-color="#0f1512"/>
      <stop offset="1" stop-color="#111c15"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25c281" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3ef0a4" stop-opacity=".14"/>
      <stop offset="1" stop-color="#25c281" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25c281"/>
      <stop offset=".5" stop-color="#eafff5"/>
      <stop offset="1" stop-color="#25c281"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.3" fill="#25c281" opacity=".10"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#25c281" stop-opacity=".22"/>
      <stop offset="1" stop-color="#25c281" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background + dot grid -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>

  <!-- soft glow behind dumbbell -->
  <circle cx="185" cy="158" r="150" fill="url(#glow)"/>

  <!-- animated light sweep -->
  <rect x="-320" y="0" width="320" height="320" fill="url(#sweep)">
    <animate attributeName="x" values="-320;1200" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- pulsing rings behind dumbbell -->
  <circle cx="185" cy="158" r="96" fill="none" stroke="#25c281" stroke-width="2" opacity=".45">
    <animate attributeName="r" values="88;120;88" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;.08;.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="185" cy="158" r="72" fill="none" stroke="#25c281" stroke-width="1.5" opacity=".3">
    <animate attributeName="r" values="72;100;72" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".3;.05;.3" dur="3.2s" begin="0.9s" repeatCount="indefinite"/>
  </circle>

  <!-- dumbbell icon -->
  <g transform="translate(185,158)" stroke="#25c281" stroke-width="7" stroke-linecap="round">
    <line x1="-58" y1="0" x2="58" y2="0"/>
    <line x1="-46" y1="-26" x2="-46" y2="26"/>
    <line x1="-24" y1="-38" x2="-24" y2="38"/>
    <line x1="24" y1="-38" x2="24" y2="38"/>
    <line x1="46" y1="-26" x2="46" y2="26"/>
  </g>
  <circle cx="185" cy="158" r="6" fill="#3ef0a4">
    <animate attributeName="fill" values="#25c281;#eafff5;#25c281" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- divider -->
  <line x1="330" y1="70" x2="330" y2="250" stroke="#25c281" stroke-opacity=".25" stroke-width="1.5"/>

  <!-- English title (default) -->
  <text x="380" y="118" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="46" font-weight="800" fill="url(#title)" letter-spacing="1">FST-7 Swim Physique Dashboard</text>

  <!-- English subtitle -->
  <text x="382" y="156" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" fill="#9fe8c8">Personal 3-day Push / Pull / Legs — set-by-set logging, progress &amp; science</text>

  <!-- Persian subtitle -->
  <text x="382" y="192" font-family="Vazirmatn,'Segoe UI',Tahoma,sans-serif" font-size="17" fill="#79c9a8" direction="rtl">داشبورد شخصی فیتنس — برنامهٔ شناگر با فینیشر FST-7</text>

  <!-- stat chips -->
  <g font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="14" font-weight="600">
    <rect x="382" y="216" width="120" height="32" rx="16" fill="#25c281" fill-opacity=".12" stroke="#25c281" stroke-opacity=".45"/>
    <text x="442" y="237" text-anchor="middle" fill="#7fe0b6">Push · Pull · Legs</text>

    <rect x="514" y="216" width="118" height="32" rx="16" fill="#25c281" fill-opacity=".12" stroke="#25c281" stroke-opacity=".45"/>
    <text x="573" y="237" text-anchor="middle" fill="#7fe0b6">FST-7 · 7 × 45s</text>

    <rect x="644" y="216" width="96" height="32" rx="16" fill="#25c281" fill-opacity=".12" stroke="#25c281" stroke-opacity=".45"/>
    <text x="692" y="237" text-anchor="middle" fill="#7fe0b6">RPE 8–9</text>

    <rect x="752" y="216" width="122" height="32" rx="16" fill="#25c281" fill-opacity=".12" stroke="#25c281" stroke-opacity=".45"/>
    <text x="813" y="237" text-anchor="middle" fill="#7fe0b6">100% Offline</text>
  </g>

  <!-- animated progress dots -->
  <g fill="#25c281">
    <circle cx="382" cy="272" r="3.5"><animate attributeName="opacity" values="1;.15;1" dur="1.8s" begin="0s" repeatCount="indefinite"/></circle>
    <circle cx="400" cy="272" r="3.5"><animate attributeName="opacity" values="1;.15;1" dur="1.8s" begin=".25s" repeatCount="indefinite"/></circle>
    <circle cx="418" cy="272" r="3.5"><animate attributeName="opacity" values="1;.15;1" dur="1.8s" begin=".5s" repeatCount="indefinite"/></circle>
    <circle cx="436" cy="272" r="3.5"><animate attributeName="opacity" values="1;.15;1" dur="1.8s" begin=".75s" repeatCount="indefinite"/></circle>
    <circle cx="454" cy="272" r="3.5"><animate attributeName="opacity" values="1;.15;1" dur="1.8s" begin="1s" repeatCount="indefinite"/></circle>
    <text x="474" y="277" font-family="'Segoe UI',Roboto,sans-serif" font-size="12.5" fill="#5da98a">training week · Sat / Mon / Wed</text>
  </g>

  <!-- footer strip -->
  <rect x="0" y="304" width="1200" height="16" rx="8" fill="#25c281" fill-opacity=".08"/>
</svg>
