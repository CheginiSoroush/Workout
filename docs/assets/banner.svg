<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="داشبورد فیتنس من — برنامه شناگر FST-7">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a100c"/>
      <stop offset=".55" stop-color="#0f1512"/>
      <stop offset="1" stop-color="#111c15"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25c281" stop-opacity="0"/>
      <stop offset=".5" stop-color="#3ef0a4" stop-opacity=".16"/>
      <stop offset="1" stop-color="#25c281" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25c281"/>
      <stop offset=".5" stop-color="#eafff5"/>
      <stop offset="1" stop-color="#25c281"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1.6" cy="1.6" r="1.3" fill="#25c281" opacity=".10"/>
    </pattern>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#25c281" stop-opacity=".22"/>
      <stop offset="1" stop-color="#25c281" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- پس‌زمینه + شبکه نقطه‌ای -->
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#dots)"/>

  <!-- هالهٔ ملایم پشت هالتر -->
  <circle cx="185" cy="158" r="150" fill="url(#glow)"/>

  <!-- سویپ نوری متحرک -->
  <rect x="-320" y="0" width="320" height="320" fill="url(#sweep)">
    <animate attributeName="x" values="-320;1200" dur="5.5s" repeatCount="indefinite"/>
  </rect>

  <!-- حلقهٔ تپنده پشت هالتر -->
  <circle cx="185" cy="158" r="96" fill="none" stroke="#25c281" stroke-width="2" opacity=".45">
    <animate attributeName="r" values="88;120;88" dur="3.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".45;.08;.45" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- هالتر برند — تپنده -->
  <g transform="translate(185,158)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1;1.05;1" dur="3.2s" repeatCount="indefinite"/>
      <g fill="#25c281">
        <rect x="-88" y="-22" width="16" height="44" rx="5"/>
        <rect x="-68" y="-36" width="21" height="72" rx="6"/>
        <rect x="47" y="-36" width="21" height="72" rx="6"/>
        <rect x="72" y="-22" width="16" height="44" rx="5"/>
        <rect x="-47" y="-9" width="94" height="18" rx="8"/>
      </g>
      <g fill="#eafff5" opacity=".9">
        <rect x="-83" y="-14" width="6" height="28" rx="3" opacity=".35"/>
        <rect x="77" y="-14" width="6" height="28" rx="3" opacity=".35"/>
      </g>
    </g>
  </g>

  <!-- نشان FST-7 -->
  <g transform="translate(185,268)">
    <circle r="27" fill="#0f1512" stroke="#25c281" stroke-width="2.5"/>
    <text x="0" y="6" text-anchor="middle" font-family="Arial, 'Segoe UI', sans-serif" font-size="17" font-weight="800" fill="#3ef0a4" letter-spacing="1">FST-7</text>
    <circle r="27" fill="none" stroke="#3ef0a4" stroke-width="1.5" opacity=".5">
      <animate attributeName="r" values="27;38" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- تیترها -->
  <g direction="rtl" unicode-bidi="embed">
    <text x="665" y="118" text-anchor="middle" font-family="Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="56" font-weight="800" fill="url(#shine)">داشبورد فیتنس من</text>
    <text x="665" y="172" text-anchor="middle" font-family="Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="29" font-weight="600" fill="#a9c7b6">برنامهٔ «شناگر» — اصول FST-7 هانی رامبد</text>
    <text x="665" y="222" text-anchor="middle" font-family="Vazirmatn, 'Segoe UI', Tahoma, sans-serif" font-size="22" fill="#6f8a7b">Push · Pull · Legs + Abs — دستگاه ↔ وزنهٔ آزاد</text>
  </g>

  <!-- نشان‌های پایین -->
  <g font-family="Arial, 'Segoe UI', sans-serif" font-size="16" font-weight="700">
    <g transform="translate(1128,264)">
      <rect x="-330" y="-18" width="160" height="34" rx="17" fill="#12241b" stroke="#25c281" stroke-opacity=".55"/>
      <text x="-250" y="5" text-anchor="middle" fill="#3ef0a4">Next.js 16</text>
      <rect x="-160" y="-18" width="160" height="34" rx="17" fill="#12241b" stroke="#25c281" stroke-opacity=".55">
        <animate attributeName="stroke-opacity" values=".55;1;.55" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="-80" y="5" text-anchor="middle" fill="#3ef0a4">TypeScript</text>
    </g>
  </g>

  <!-- خط پایینی درخشان -->
  <rect x="60" y="300" width="1080" height="3" rx="1.5" fill="#25c281" opacity=".35">
    <animate attributeName="opacity" values=".35;.8;.35" dur="3.2s" repeatCount="indefinite"/>
  </rect>
</svg>
