name: Deploy to GitHub Pages

# هر push روی main → بیلد استاتیک + انتشار روی Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Generate Prisma client
        run: bun run db:generate

      # خروجی استاتیک نمی‌تواند route داشته باشد — شیم کلاینت
      # (src/lib/staticApi.ts) جایگزین همه‌شان می‌شود
      - name: Remove server API routes
        run: rm -rf src/app/api

      - name: Build static export
        run: bun run build:static

      - name: Rewrite absolute asset paths for /Workout/
        run: bash scripts/fix-pages-paths.sh

      # گارد رگرسیون: اگر مسیر public بدون پیشوند /Workout در خروجی مانده
      # باشد (مثل رشتهٔ تکی "/exercises" که قبلاً از دست می‌رفت)، بیلد شکست
      # بخورد تا نسخهٔ خراب هرگز منتشر نشود
      - name: Guard — no unprefixed public asset paths
        run: |
          if grep -rEq "\"/(exercises|stretches|fonts|exports)|'/(exercises|stretches|fonts|exports)|url\(/(exercises|stretches|fonts|exports)" out --include="*.js" --include="*.html" --include="*.css"; then
            echo "::error::Unprefixed public asset paths found in build output — /Workout rewrite missed them"
            grep -rEn "\"/(exercises|stretches|fonts|exports)" out --include="*.js" | head -5 || true
            exit 1
          fi
          echo "✅ همهٔ مسیرهای public پیشوند /Workout دارند"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
